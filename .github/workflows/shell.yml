name: Shell

on:
  push:
    branches: [main]
    paths:
      - "setup.sh"
      - ".github/workflows/shell.yml"
  pull_request:
    paths:
      - "setup.sh"
      - ".github/workflows/shell.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck setup.sh

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n setup.sh
